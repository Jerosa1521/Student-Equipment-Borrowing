<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Equipment Borrowing System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #dc2626;
            overflow-wrap: anywhere;
        }

        a {
            color: #1d4ed8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Equipment Borrowing</h1>

        <p class="subtitle">
            Student Equipment Borrowing Management System
        </p>

        <form id="loginForm">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                maxlength="50"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <p style="text-align: right; margin: 0 0 18px;">
                <a href="forgot-password.html">
                    Forgot Password?
                </a>
            </p>

            <button type="submit" id="loginButton">
                Login
            </button>

            <p id="message" role="alert" aria-live="polite"></p>

        </form>

        <p style="text-align: center; margin-top: 18px; font-size: 14px; color: #334155;">
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {

        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const button = document.getElementById("loginButton");

        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            message.style.color = "#334155";
            message.textContent = "Connecting to server...";
            button.disabled = true;

            try {

                const response = await fetch("login.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: document.getElementById("username").value.trim(),
                        password: document.getElementById("password").value
                    })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    message.style.color = "#dc2626";
                    message.textContent =
                        result.message || "Login failed.";
                    return;
                }

                if (result.role === "admin") {

                    window.location.href = "admin-dashboard.html";

                } else if (result.role === "student") {

                    window.location.href = "student-dashboard.php";

                } else {

                    message.style.color = "#dc2626";
                    message.textContent = "Unknown account role.";

                }

            } catch (error) {

                console.error("Login error:", error);

                message.style.color = "#dc2626";
                message.textContent =
                    "Connection error. Please check your XAMPP server and login.php.";

            } finally {

                button.disabled = false;

            }

        });

    });
    </script>

</body>
</html>
